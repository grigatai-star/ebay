# Что режем автоматически.
#
# saturated_brands — ниши, где на Kleinanzeigen/Vinted продавца по умолчанию
# подозревают в мошенничестве: покупатель требует видеосозвон, оплату при
# получении, "покажи чек". Товар зависает, даже если он настоящий.
#
# junk_keywords — слова, после которых лот бесполезен для перепродажи
# (запчасти, пустые коробки, инструкции, реплики, аксессуары вместо товара).
#
# Диапазон цен здесь же — он применяется ко всем нишам.

price_min: 80
price_max: 500
allow_defect: false

extra_saturated_brands:
  # к встроенному списку (смартфоны, GPS-часы, консоли, дроны, люкс)
  - "vinted"          # перепродажные лоты-пустышки
  - "bitcoin"
  - "miner"
  - "tesla"
  - "vape"
  - "e-zigarette"

extra_junk_keywords:
  - "nur für teile"
  - "ohne akku"
  - "ohne ladegerät"
  - "ohne netzteil"
  - "unvollständig"
  - "3d druck"
  - "selbstgebaut"
