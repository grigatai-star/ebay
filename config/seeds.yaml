    tags: [kleinanzeigen, hochwertig]
    buy_ratio: 0.35
    note: "Осенью тепловизоры разбирают под поиск теплопотерь. Узкая, но маржинальная ниша."

  - key: heizen_entfeuchten
    label: "Обогрев и осушение (Luftentfeuchter / Infrarotheizung / Ölradiator)"
    queries:
      - "Luftentfeuchter Bautrockner"
      - "Infrarotheizung"
      - "Ölradiator Heizung"
      - "Luftreiniger Philips"
    season: [9, 10, 11, 12, 1]
    tags: [kleinanzeigen]
    buy_ratio: 0.40
    note: "Чисто сезонный всплеск с первыми холодами и сыростью в квартирах."

  - key: motorrad_ausruestung
    label: "Мотоэкипировка (Schuberth / Held / Givi)"
    queries:
      - "Schuberth Helm"
      - "Motorradjacke Held"
      - "Givi Koffer Motorrad"
    season: [3, 4, 5, 9]
    tags: [vinted, kleinanzeigen]
    buy_ratio: 0.35
    note: "Осенью конец сезона — покупают дёшево, продавать лучше весной. Хранить до марта."

  - key: porzellan_silber
    label: "Фарфор и столовое серебро (Meissen / WMF / 800er Silber)"
    queries:
      - "Meissen Porzellan"
      - "WMF Cromargan Besteck"
      - "Silberbesteck 800"
      - "Rosenthal Service"
    season: [10, 11, 12]
    tags: [kleinanzeigen]
    buy_ratio: 0.35
    note: "У ломбардов лежит по цене лома. Перед Рождеством уходит как подарочное."

  - key: design_moebel
    label: "Дизайн-мебель и лампы (Vitra / USM / Thonet / Artemide)"
    queries:
      - "Vitra Stuhl"
      - "USM Haller"
      - "Thonet Stuhl"
      - "Artemide Lampe"
    season: []
    tags: [bulky, hochwertig]
    buy_ratio: 0.30
    note: "Крупногабарит, только самовывоз, зато маржа кратная. Проверять оригинальность."

  - key: angeln_jagd
    label: "Рыбалка (Shimano / Daiwa катушки и удилища)"
    queries:
      - "Shimano Angelrolle"
      - "Daiwa Angelrolle"
      - "Angelrute Set"
    season: [3, 4, 5, 6, 9, 10]
    tags: [kleinanzeigen]
    buy_ratio: 0.35
    note: "Узкая, но с фанатичной аудиторией, которая знает цены и берёт сразу."
